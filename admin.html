<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المطور | محلولة</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* تنسيقات إضافية خاصة بلوحة التحكم المصغرة */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .admin-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--dark-blue);
        }
        .admin-card h3 { color: var(--orange-accent); margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #ccc; font-family: inherit;
        }
        .controls-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <img src="https://ibb.co/m549c0ZG" alt="Logo" class="nav-logo" style="width: 40px;">
        <span class="nav-title">محلولة - لوحة المطور (MAZA)</span>
        <button class="btn-raised btn-orange" style="margin-right: auto; padding: 5px 15px;" onclick="window.location.href='index.html'">خروج</button>
    </header>

    <main class="dashboard-container">
        <div class="admin-card">
            <h3>إدارة المحلات التجارية</h3>
            <div class="form-group">
                <input type="text" placeholder="اسم المحل الجديد...">
            </div>
            <div class="form-group">
                <select>
                    <option>اختر القسم (طلبات منتجات، مزارع، مطاعم)</option>
                    <option>الطلبات</option>
                    <option>المزارع والشاليهات</option>
                    <option>المطاعم والكافيهات</option>
                </select>
            </div>
            <div class="controls-grid">
                <button class="btn-raised btn-blue">إضافة المحل</button>
                <button class="btn-raised btn-orange">تعديل المحلات الحالية</button>
            </div>
        </div>

        <div class="admin-card">
            <h3>التحكم الشامل بالمنتجات والصور</h3>
            <div class="controls-grid">
                <button class="btn-raised btn-blue">إضافة/إزالة صور للمنتجات</button>
                <button class="btn-raised btn-orange">تعديل أسعار (عادي/فوري)</button>
            </div>
        </div>

        <div class="admin-card">
            <h3>نماذج طلبات الزبائن (مراقبة شاملة)</h3>
            <p>هنا تظهر جميع الطلبات الموجهة لكافة التجار لمراقبتها.</p>
            <div style="background: #f1f1f1; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <strong>طلب #101:</strong> منتج X - الكمية 2 - السعر الفوري. (مُرسل لتاجر: متجر الأمل)
            </div>
        </div>
    </main>

</body>
</html>
