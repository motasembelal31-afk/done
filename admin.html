<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكنترول الشامل | MAZA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #admin-login {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--primary-dark); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div id="admin-login">
        <div class="login-box">
            <img src="logo.png" alt="Logo" style="width: 100px; margin-bottom: 20px;">
            <h2 style="color: var(--primary-dark); margin-bottom: 20px;">بوابة المطور (MAZA)</h2>
            <div class="input-group">
                <input type="text" id="adminUser" placeholder="اسم المستخدم">
            </div>
            <div class="input-group">
                <input type="password" id="adminPass" placeholder="كلمة المرور">
            </div>
            <button class="btn btn-brand" style="width: 100%;" onclick="verifyAdmin()">دخول للكنترول</button>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <header class="top-nav" style="background: var(--primary-dark); color: white;">
            <span class="nav-title" style="-webkit-text-fill-color: white;">كنترول محلولة الموحد</span>
            <button class="btn" style="background: var(--danger); color: white; margin-right: auto;" onclick="logoutAdmin()">خروج</button>
        </header>

        <main class="container">
            
            <div class="grid">
                <div class="card">
                    <h3>متاجر بانتظار الموافقة والتفعيل</h3>
                    <div style="padding: 10px; border-bottom: 1px solid #eee;">
                        <p><strong>متجر:</strong> العائلة للمزارع</p>
                        <p><strong>القسم:</strong> المزارع والشاليهات</p>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="btn btn-brand" style="flex: 1;">موافقة ونشر</button>
                            <button class="btn btn-dark" style="flex: 1; background: var(--danger);">رفض</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>جميع الطلبات (مراقبة النظام)</h3>
                    <div style="background: var(--bg-color); padding: 10px; border-radius: 8px;">
                        <p><strong>طلب #1029</strong> - الزبون: محمد - المتجر: الأمل</p>
                        <p>الحالة: بانتظار تأكيد التاجر</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // الكود المسؤول عن حماية صفحة المطور
        function verifyAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if(user === 'MAZA' && pass === 'admin6682') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else {
                alert('بيانات غير صحيحة! محاولة دخول غير مصرح بها.');
            }
        }

        function logoutAdmin() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
