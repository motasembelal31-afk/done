<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلولة | Done</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <img src="https://ibb.co/m549c0ZG" alt="محلولة Logo" class="splash-logo">
            <h1 id="typing-text" class="typing-effect"></h1>
        </div>
    </div>

    <div id="main-ui" class="hidden">
        <header class="top-nav">
            <img src="https://ibb.co/m549c0ZG" alt="Logo" class="nav-logo">
            <span class="nav-title">محلولة</span>
            <div id="admin-trigger" onclick="promptAdminLogin()"></div>
        </header>

        <main class="content-area">
            <div class="login-section">
                <button class="btn-raised btn-blue" onclick="loginWithGoogle()">تسجيل الدخول عبر Gmail</button>
            </div>

            <section class="categories">
                <button class="btn-raised btn-orange">الطلبات</button>
                <button class="btn-raised btn-blue">حجز المزارع والشاليهات</button>
                <button class="btn-raised btn-orange">حجز المطاعم والكافيهات</button>
            </section>

            <section class="products-grid">
                <div class="product-card">
                    <img src="product-placeholder.jpg" alt="صورة المنتج">
                    <h3>اسم المنتج</h3>
                    <div class="prices">
                        <span class="price-normal">توصيل عادي: 5 دنانير</span>
                        <span class="price-fast">توصيل فوري: 7 دنانير</span>
                    </div>
                    <div class="actions">
                        <button class="btn-raised btn-orange">طلب المنتج</button>
                        <button class="btn-raised btn-blue">التفاصيل</button>
                    </div>
                    <a href="https://wa.me/962771965336" class="btn-support" target="_blank">تواصل مع التاجر</a>
                </div>
            </section>
        </main>

        <button id="ai-guide-btn" class="ai-float-btn" onclick="toggleAIGuide()">🤖 دليل</button>
        <a href="https://wa.me/962771965336" class="whatsapp-float" target="_blank">💬 الدعم</a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
