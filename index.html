<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلولة | Done</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <img src="logo.png" alt="محلولة Logo" class="splash-logo">
    </div>

    <div id="main-ui" class="hidden">
        <header class="top-nav">
            <img src="logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">محلولة</span>
            <div style="flex-grow: 1; height: 40px;" ondblclick="window.location.href='admin.html'"></div>
            <button id="loginBtn" class="btn btn-dark" onclick="alert('سيتم تفعيل ربط الجيميل عند رفع المشروع')">تسجيل دخول</button>
        </header>

        <main class="container">
            <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;">
                <button class="btn btn-brand" style="flex: 1; min-width: 120px;">الطلبات</button>
                <button class="btn btn-dark" style="flex: 1; min-width: 120px;">المزارع</button>
                <button class="btn btn-dark" style="flex: 1; min-width: 120px;">المطاعم</button>
            </div>

            <h2 style="margin-top: 20px; color: var(--primary-dark);">المنتجات المتوفرة</h2>
            <div id="productsList" class="grid">
                
                <div class="card">
                    <img src="https://via.placeholder.com/300" alt="صورة المنتج">
                    <h3>اسم المنتج التجريبي</h3>
                    <div class="stock-badge">الكمية المتبقية: 5</div>
                    <div class="price-tag">
                        <span class="normal-price">عادي: 5 JOD</span>
                        <span class="fast-price">فوري: 7 JOD</span>
                    </div>
                    <div class="input-group">
                        <select id="orderType">
                            <option value="normal">توصيل عادي (5 JOD)</option>
                            <option value="fast">توصيل فوري (7 JOD)</option>
                        </select>
                    </div>
                    <button class="btn btn-brand" style="width: 100%;">اطلب الآن</button>
                </div>

                <div class="card" style="opacity: 0.7;">
                    <img src="https://via.placeholder.com/300" alt="صورة المنتج">
                    <h3>منتج منتهي</h3>
                    <div class="stock-badge" style="background: var(--danger); color: white;">الكمية المتبقية: 0</div>
                    <button class="btn btn-disabled" style="width: 100%; margin-top: 45px;" disabled>Sold Out - نفدت الكمية</button>
                </div>

            </div>
            
            <h2 style="margin-top: 40px; color: var(--primary-dark);">طلباتي السابقة</h2>
            <div class="grid">
                <div class="card">
                    <h4>طلب رقم: #1029</h4>
                    <p>المنتج: اسم المنتج</p>
                    <p>الحالة: <span style="color: green;">قيد التوصيل</span></p>
                    <a href="https://wa.me/962771965336?text=مرحبا الدعم الفني، عندي استفسار بخصوص طلبي رقم 1029" target="_blank" class="btn btn-dark" style="margin-top: 10px; width: 100%; font-size: 0.9rem;">واجهت مشكلة؟ تواصل معنا</a>
                </div>
            </div>

        </main>
    </div>

    <script>
        // إزالة شاشة البداية بعد ثانيتين
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
            }, 800);
        }, 2000);
    </script>
</body>
</html>
