<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التاجر | محلولة</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="top-nav">
        <img src="logo.png" alt="Logo" class="nav-logo">
        <span class="nav-title">لوحة التاجر</span>
        <button class="btn btn-brand" style="margin-right: auto;" onclick="window.location.href='index.html'">رجوع للمتجر</button>
    </header>

    <main class="container">
        
        <div class="card" style="margin-bottom: 20px;">
            <h3>إعداد متجرك (بانتظار موافقة الإدارة)</h3>
            <div class="input-group">
                <label>اختر القسم:</label>
                <select>
                    <option>الطلبات (المنتجات)</option>
                    <option>المزارع والشاليهات</option>
                    <option>المطاعم والكافيهات</option>
                </select>
            </div>
            <button class="btn btn-dark">تقديم طلب النشر للمطور</button>
        </div>

        <div class="grid">
            <div class="card">
                <h3>إضافة وتجديد المنتجات</h3>
                <div class="input-group">
                    <label>اسم المنتج:</label>
                    <input type="text">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <label>السعر العادي:</label>
                        <input type="number">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>السعر الفوري:</label>
                        <input type="number">
                    </div>
                </div>
                <div class="input-group">
                    <label>الكمية المتوفرة (لتجنب Sold Out):</label>
                    <input type="number" min="1">
                </div>
                <button class="btn btn-brand" style="width: 100%;">نشر/تحديث المنتج</button>
            </div>

            <div class="card">
                <h3>الطلبات الواردة لمتجري</h3>
                <div style="background: var(--bg-color); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid var(--primary-dark);">
                    <p><strong>رقم الطلب:</strong> #1029</p>
                    <p><strong>المنتج:</strong> اسم المنتج</p>
                    <p><strong>نوع التوصيل:</strong> فوري (7 JOD)</p>
                    <button class="btn btn-dark" style="margin-top: 10px;">تأكيد وتجهيز الطلب</button>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
